[workspace]
resolver = "2"

members = [
    "wolfram-app-discovery",
    "wolfram-expr",
    "wolfram-serialize",
    "wolfram-serialize-macros",
    "wstp",
    "wstp-sys",
    "wolfram-library-link",
    "wolfram-library-link-sys",
    "wolfram-export-macros",
    "wolfram-export-core",
    "wolfram-export",
    "wolfram-test-lib",
    "wolfram-cli",
    "xtask",
]

# `WolframExample` is a self-contained Wolfram paclet, not part of this
# workspace. Its Rust crates live in WolframExample/libs and form their own
# standalone workspace (see WolframExample/libs/Cargo.toml): they depend on the
# published crates.io releases of this repo's crates (not local paths), so they
# aren't members here and have their own Cargo.lock. Unlike `wolfram-test-lib`,
# they're meant to be copy-pasted as standalone starting points, not built from
# this repo.
exclude = ["WolframExample"]

# default-members excludes the -sys crates so contributors without a local
# Wolfram installation can still run `cargo check` / `cargo test` from the
# workspace root. Building the -sys crates requires Wolfram (their build
# scripts use `wolfram-app-discovery` to locate the C headers).
default-members = [
    "wolfram-expr",
    "wolfram-serialize",
    "wolfram-serialize-macros",
    "wstp",
    "wolfram-library-link",
    "wolfram-export-macros",
    "wolfram-export-core",
    "wolfram-export",
]
