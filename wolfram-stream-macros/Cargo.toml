[package]
name = "wolfram-stream-macros"
version = "0.6.0"
license = "MIT OR Apache-2.0"
edition = "2021"
repository = "https://github.com/WolframResearch/wolfram-rust-library"
description = "Procedural macros (#[derive(InputStream, OutputStream)]) for wolfram-library-link streams"
keywords = ["wolfram", "wolfram-library-link", "librarylink", "streams", "macros"]
categories = ["external-ffi-bindings", "development-tools::ffi"]
readme = "README.md"

include = [
    "/src",
    "/docs",
]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.36"
syn = { version = "1.0.85", features = ["full"] }
quote = "1.0.14"

# Doc-example only: the derives emit `::wolfram_library_link::stream::*` paths,
# so the rustdoc examples need the runtime crate present to compile.
# `wolfram-library-link` depends back on this crate, but Cargo permits
# dev-dependency cycles.
#
# The version requirement here is deliberately a loose (non-`=`) caret range,
# NOT lockstep-bumped with this crate's own version: at publish time it resolves
# against whatever's already on crates.io (never the in-flight, not-yet-published
# version), so it doesn't recreate the chicken-and-egg problem on every release.
# Locally, the `path` always wins and these doctests run against the current
# in-repo code regardless of this version string.
[dev-dependencies]
wolfram-library-link = { version = "0.6.1", path = "../wolfram-library-link", default-features = false }
